[package]
name = "api"
edition.workspace = true
version.workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
contract = { path = "contract" }

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

age = "0.11"
axum = "0.8"
futures-util = "0.3"
hmac = "0.12"
http = "1"
reqwest.workspace = true
rmcp = { version = "3.2", features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1"] }
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
